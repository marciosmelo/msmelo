{{- /* Fediverse: criador (Mastodon link attribution) + ponte ActivityPub (Bridgy Fed) */ -}}
{{- with site.Params.fediverseCreator }}
<meta name="fediverse:creator" content="{{ . }}">
{{- end }}
{{- if or .IsPage .IsHome .IsSection }}
<link rel="alternate" type="application/activity+json" href="https://fed.brid.gy/r/{{ .Permalink }}">
{{- end }}
