# -- PaperMod params --
# https://github.com/adityatelange/hugo-PaperMod/wiki/Features

env = "production"
defaultTheme = "auto"
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = false
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = true
disableScrollToTop = false
hideFooter = false
hideMeta = false
hideSummary = false
ShowFullTextinRSS = false
mainSections = ["posts"]
homeRecentCount = 5
ShowLikes = true

fediverseCreator = "@msmelo@bolha.one"

[postAside]
  email = "marciomelo@gmail.com"
  commentLead = "Quer comentar?"
  commentBefore = "Só enviar um "
  commentLink = "e-mail"
  commentAfter = " — falar comigo, sabe? Como faziam os Maias."
  hateLead = "Não gostou?"
  hateLink = "Compartilhe"
  hateRest = "com alguém que você odeie e não sofra sozinho."

[cover]
  hidden = false
  hiddenInList = false
  hiddenInSingle = false
  responsiveImages = true
  linkFullImages = true

[label]
