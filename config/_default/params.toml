# -- PaperMod params --
# https://github.com/adityatelange/hugo-PaperMod/wiki/Features

env = "production"
defaultTheme = "auto"
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = false
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = true
disableScrollToTop = false
hideFooter = false
hideMeta = false
hideSummary = false
ShowFullTextinRSS = false
mainSections = ["posts"]
homeRecentCount = 5
ShowLikes = true

# Conta Mastodon pessoal. Blog no Fediverse via Bridgy: @msmelo.blog@msmelo.blog (sem usar a bolha).
fediverseCreator = "@msmelo@bolha.one"

# Capas: imagens nos bundles (featured.*) são detectadas no override de cover.html
[cover]
  hidden = false
  hiddenInList = false
  hiddenInSingle = false
  responsiveImages = true
  linkFullImages = true

[label]
  text = "MSMelo.Blog"
  icon = "/img/msmelo-favicon-color.png"
  iconHeight = 28

[assets]
  favicon = "/img/msmelo-favicon-color.png"
  favicon16x16 = "/img/msmelo-favicon-color.png"
  favicon32x32 = "/img/msmelo-favicon-color.png"
  apple_touch_icon = "/img/msmelo-favicon-color.png"
  disableHLJS = false
  disableFingerprinting = false

# Firebase (mesmo projeto do Blowfish — likes Firestore)
[firebase]
  apiKey = "AIzaSyB5skqvTGFBj1zNMQugvvy-U0aMUIF67ck"
  authDomain = "msmelo-751ee.firebaseapp.com"
  projectId = "msmelo-751ee"
  storageBucket = "msmelo-751ee.appspot.com"
  messagingSenderId = "480375533959"
  appId = "1:480375533959:web:aac02cce61ea6ad3c3e322"
  measurementId = "G-PWQT6Y8M01"

# Bloco compacto na home (foto + frases) — o partial home_info.html renderiza o autor
[homeInfoParams]
  AlignSocialIconsTo = "center"

# Foto + headline na home (bio fica só em /sobre)
[author]
  name = "M.S.Melo"
  image = "eu-autor.jpg"
  headline = "Bairrista praticante | Especialista em procrastinação | Escritor nas horas vagas."

