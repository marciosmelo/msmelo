# -- Site Configuration --
# Tema: PaperMod — https://github.com/adityatelange/hugo-PaperMod

theme = "PaperMod"
baseURL = "https://msmelo.blog/"
defaultContentLanguage = "pt-br"

pluralizeListTitles = true

enableRobotsTXT = true
summaryLength = 70

[pagination]
  pagerSize = 20


buildDrafts = false
buildFuture = false

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "categories"
    weight = 100

  [[related.indices]]
    name = "series"
    weight = 50

  [[related.indices]]
    name = "authors"
    weight = 20

  [[related.indices]]
    name = "date"
    weight = 10
